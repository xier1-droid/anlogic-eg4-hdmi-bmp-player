# 山洪卡（虚构河谷村，生图 AI 底图 tools/Photo/flood/，不入库）：致因 → 发生 → 后果 → 撤离。
# 准备：py -I tools/scenes/flood_village/prepare_flood_village.py
# 生成：py -I tools/make_scene_pack.py tools/scenes/flood_village/scene.yaml --gif
# 坐标为 640x480 像素。PIC1/PIC3/PIC4 为同一斜俯视构图：河从左上流向右下，村子在近岸低阶地，
# 远岸有 5 户，一座桥；PIC2 为村旁河岸近景。
name: flood_village
format: 3
size: [640, 480]
base: pic1.png
output: out
village: 河湾村                          # M5 OSD：预警模式标题（TEXT 段 0）
warning: 红色预警！立即沿本岸小路上山！   # M5 OSD：预警模式字幕（TEXT 段 9）

stages:
  - name: 致因：上游强降雨，河水上涨
    # 河道及沿岸低地（洪水最大淹没范围）用黄色虚线框出。
    image: pic1.png
    hazard: flood
    role: cause
    title: 阶段1 致因：河水上涨                # M5 OSD 标题（≤16 格）；字幕默认取旁白
    legend: [[zone, 可能淹没范围], [rain, 降雨]]
    narration:                              # M4 旁白，t 为 0–239 时间轴（1× 下每秒 30）
      - {t: 0, text: 上游强降雨，河水快速上涨。, file: voice/flood_s1_t000.wav}
      - {t: 110, text: 黄色虚线是洪水可能淹到的范围。, file: voice/flood_s1_t110.wav}
    sources:
      - {type: outline, region: 0, width: 3, points: [[116, 108], [214, 196], [300, 270], [356, 318], [382, 390], [440, 479], [639, 479], [639, 330], [520, 252], [400, 212], [290, 172], [200, 118], [140, 88]]}

  - name: 发生：洪峰从上游涌下，漫过河岸，冲进农田
    # 河岸近景，上游在画面左侧（与 PIC1 河流方向一致）。
    #   1. 洪峰（t 0–100）：浑浊的洪水前锋沿河道从左向右冲过，龙头翻滚，之后河面浑浊、成团的白浪顺流飞奔；
    #   2. 漫顶（t 20–150）：上游一端先漫过土堤，漫溢点向下游推移，堤顶处白色水花倾泻；
    #   3. 淹田（t 24–239）：洪水从漫溢处冲进田地，上游先淹、顺流向下游蔓延，向村子推进，
    #      水面条纹顺流飞驰，前锋翻滚，止于第一排房屋前的土路。
    image: pic2.png
    hazard: flood
    role: onset
    title: 阶段2 发生：洪峰漫岸                # M5 OSD 标题（≤16 格）；字幕默认取旁白
    legend: [[mud, 洪水]]
    narration:                              # M4 旁白，t 为 0–239 时间轴（1× 下每秒 30）
      - {t: 0, text: 洪峰来了！, file: voice/flood_s2_t000.wav}
      - {t: 30, text: 河水漫过河堤，冲进农田。, file: voice/flood_s2_t030.wav}
      - {t: 150, text: 洪水逼近村子。, file: voice/flood_s2_t150.wav}
    sources:
      - type: seeds                         # 淹田：从上游一端的堤后开始
        region: 0
        points: [[0, 124], [10, 128], [20, 131]]
        mask: bank_mask.png
        dem: bank_dem.png
        climb: 1.0
        t0: 24
        t1: 239
      - type: mask                          # 堤顶漫溢：自上游向下游推移
        region: 2
        file: spill_mask.png
        grade: right
        noise: 0.1
        cell: 24
        seed: 7
        t0: 20
        t1: 150
      - type: mask                          # 河道洪峰：自左向右冲过
        region: 1
        file: river_mask.png
        grade: right
        noise: 0.08
        cell: 32
        seed: 9
        t0: 0
        t1: 100

  - name: 后果：河道与近岸低地被淹
    # 与 PIC1 同构图。淹没范围：河道、砾石滩、近岸临河的田地（到村子前缘为止）、远岸房屋下方的田地。
    # 时间按到河道中线的距离生成，用作水深：河道深、岸上浅。
    image: pic3.png
    hazard: flood
    role: aftermath
    title: 阶段3 后果：低地被淹                # M5 OSD 标题（≤16 格）；字幕默认取旁白
    legend: [[mud, 淹没区]]
    narration:                              # M4 旁白，t 为 0–239 时间轴（1× 下每秒 30）
      - {t: 0, text: 河道和近岸低地被洪水淹没。, file: voice/flood_s3_t000.wav}
      - {t: 110, text: 离河越近，水越深。, file: voice/flood_s3_t110.wav}
    sources:
      - type: seeds
        region: 0
        points: [[170, 122], [205, 148], [240, 172], [275, 196], [320, 222], [370, 246], [420, 270], [470, 296], [520, 322], [570, 348], [620, 372]]
        mask: flood_mask.png
        t0: 0
        t1: 239

  - name: 撤离：各自沿本岸小路上山，不过桥、不沿河
    # 危险区：洪水最大范围（含桥）。近岸：村子后排沿山坡小路上到左上方的避险棚；
    # 远岸：5 户沿上山小路到右上方的避险棚。两岸都不过桥（工具会检查）。
    image: pic4.png
    hazard: flood
    role: evacuation
    title: 阶段4 撤离：沿小路上山                # M5 OSD 标题（≤16 格）；字幕默认取旁白
    legend: [[danger, 危险区], [route, 撤离路线], [refuge, 避险点]]
    narration:                              # M4 旁白，t 为 0–239 时间轴（1× 下每秒 30）
      - {t: 0, text: 立即撤离！沿本岸小路上山。, file: voice/flood_s4_t000.wav}
      - {t: 110, text: 不要过桥，不要沿河走。, file: voice/flood_s4_t110.wav}
    sources:
      - {type: mask, region: 1, file: flood_mask.png}
      - type: polyline
        region: 0
        width: 4
        lines:
          - {points: [[166, 276], [140, 262], [116, 250], [96, 230], [84, 206], [72, 188], [64, 172], [62, 160]], t0: 0, t1: 200}
          - {points: [[464, 192], [482, 182], [496, 166], [512, 148], [526, 126], [540, 104], [550, 84], [556, 66]], t0: 0, t1: 200}
    spots: [[58, 150, 9], [560, 58, 9]]
