# 山洪卡（虚构河谷村，生图 AI 底图 tools/Photo/flood/，不入库）：致因 → 发生 → 后果 → 撤离。
# 准备：py -I tools/scenes/flood_village/prepare_flood_village.py
# 生成：py -I tools/make_scene_pack.py tools/scenes/flood_village/scene.yaml --gif
# 坐标为 640x480 像素。PIC1/PIC3/PIC4 为同一斜俯视构图：河从左上流向右下，村子在近岸低阶地，
# 远岸有 5 户，一座桥；PIC2 为村旁河岸近景。
name: flood_village
format: 3
size: [640, 480]
base: pic1.png
output: out

stages:
  - name: 致因：上游强降雨，河水上涨
    # 河道及沿岸低地（洪水最大淹没范围）用黄色虚线框出。
    image: pic1.png
    hazard: flood
    role: cause
    sources:
      - {type: outline, region: 0, width: 3, points: [[116, 108], [214, 196], [300, 270], [356, 318], [382, 390], [440, 479], [639, 479], [639, 330], [520, 252], [400, 212], [290, 172], [200, 118], [140, 88]]}

  - name: 发生：洪水漫过河岸，淹没农田，逼近民居
    # 河岸近景。浑水从河边漫上土堤，沿田块向下（远离河道）推进，越过土路，到第一排房屋墙脚。
    image: pic2.png
    hazard: flood
    role: onset
    sources:
      - type: seeds
        region: 0
        points: [[0, 122], [80, 152], [160, 172], [240, 192], [320, 212], [400, 236], [480, 258], [560, 278], [639, 291]]
        mask: bank_mask.png
        dem: bank_dem.png
        climb: 1.0
        t0: 0
        t1: 239

  - name: 后果：河道与近岸低地被淹
    # 与 PIC1 同构图。淹没范围：河道、砾石滩、近岸临河的田地（到村子前缘为止）、远岸房屋下方的田地。
    # 时间按到河道中线的距离生成，用作水深：河道深、岸上浅。
    image: pic3.png
    hazard: flood
    role: aftermath
    sources:
      - type: seeds
        region: 0
        points: [[170, 122], [205, 148], [240, 172], [275, 196], [320, 222], [370, 246], [420, 270], [470, 296], [520, 322], [570, 348], [620, 372]]
        mask: flood_mask.png
        t0: 0
        t1: 239

  - name: 撤离：各自沿本岸小路上山，不过桥、不沿河
    # 危险区：洪水最大范围（含桥）。近岸：村子后排沿山坡小路上到左上方的避险棚；
    # 远岸：5 户沿上山小路到右上方的避险棚。两岸都不过桥（工具会检查）。
    image: pic4.png
    hazard: flood
    role: evacuation
    sources:
      - {type: mask, region: 1, file: flood_mask.png}
      - type: polyline
        region: 0
        width: 4
        lines:
          - {points: [[166, 276], [140, 262], [116, 250], [96, 230], [84, 206], [72, 188], [64, 172], [62, 160]], t0: 0, t1: 200}
          - {points: [[464, 192], [482, 182], [496, 166], [512, 148], [526, 126], [540, 104], [550, 84], [556, 66]], t0: 0, t1: 200}
    spots: [[58, 150, 9], [560, 58, 9]]
