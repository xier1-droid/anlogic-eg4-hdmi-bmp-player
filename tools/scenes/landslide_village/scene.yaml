# 滑坡卡（虚构山村，生图 AI 底图 tools/Photo/landslide/，不入库）：致因 → 发生 → 后果 → 撤离。
# 准备：py -I tools/scenes/landslide_village/prepare_landslide_village.py
# 生成：py -I tools/make_scene_pack.py tools/scenes/landslide_village/scene.yaml --gif
# 坐标为 640x480 像素。PIC1/PIC3 为同一斜俯视构图，PIC2 为坡体近景，PIC4 为正俯视。
name: landslide_village
format: 3
size: [640, 480]
base: pic1.png
output: out

stages:
  - name: 致因：持续强降雨，坡体饱水
    # 斜俯视。坡中部裸露黄土区及其下方坡面是隐患坡体，黄色虚线框出，直到坡脚梯田上沿。
    image: pic1.png
    hazard: landslide
    role: cause
    sources:
      - {type: outline, region: 0, width: 3, points: [[300, 118], [360, 100], [420, 110], [445, 170], [452, 240], [445, 285], [300, 288], [282, 235], [288, 170]]}

  - name: 发生：坡顶拉裂、坡体下滑、落石
    # 坡体近景。后缘弧形裂缝沿坡顶从中间向两侧扩展；
    # 随后滑坡体下错，裂缝下方露出新鲜黄土的后壁（主滑壁），并逐渐向坡下加宽；
    # 滑坡体逐渐变暗下沉；三条落石路线沿坡面最陡处滚到坡脚房屋后墙。
    image: pic2.png
    hazard: landslide
    role: onset
    sources:
      - type: polygon                       # 滑坡体：裂缝形成后开始下滑，边缘不规则
        region: 2
        t0: 96
        rough: 6
        seed: 11
        points: [[262, 100], [300, 74], [400, 64], [490, 96], [515, 130], [530, 240], [520, 340], [470, 364], [330, 364], [270, 330], [250, 220]]
      - type: polyline                      # 落石路线：时间即沿路线的位置
        region: 3
        width: 7
        lines:
          - {points: [[330, 112], [322, 200], [318, 300], [324, 372]], t0: 0, t1: 239}
          - {points: [[410, 118], [420, 220], [430, 320], [440, 384]], t0: 0, t1: 239}
          - {points: [[470, 150], [490, 250], [505, 340], [518, 392]], t0: 0, t1: 239}
      - type: seeds                         # 主滑壁：从裂缝向坡下加宽
        region: 1
        points: [[266, 98], [296, 78], [330, 64], [380, 58], [430, 64], [470, 80], [500, 102], [512, 124]]
        mask: scarp_mask.png
        t0: 100
        t1: 200
      - type: polyline                      # 主裂缝：从中间向两侧扩展
        region: 0
        width: 3
        lines:
          - {points: [[380, 58], [330, 64], [296, 78], [266, 98]], t0: 0, t1: 90}
          - {points: [[380, 58], [430, 64], [470, 80], [500, 102], [512, 124]], t0: 0, t1: 90}

  - name: 后果：坡体滑塌，堆积掩埋坡脚房屋和道路
    # 与 PIC1 同构图。滑坡后壁露出新鲜黄土；堆积体从坡脚向下扩展，盖过梯田、坡下房屋，止于道路。
    image: pic3.png
    hazard: landslide
    role: aftermath
    sources:
      - type: seeds                         # 堆积体：从坡脚中部向下、向两侧扩展
        region: 0
        points: [[350, 252], [366, 252], [382, 252]]
        mask: deposit_mask.png
        t0: 0
        t1: 239
      - {type: polygon, region: 1, rough: 5, seed: 13, points: [[300, 118], [360, 100], [420, 110], [445, 170], [450, 232], [300, 232], [288, 175]]}   # 滑坡后壁

  - name: 撤离：横向离开滑坡影响区，到东侧避险点
    # 正俯视。危险区：后壁 (x 292–408) 及其下方滑移、堆积范围，向下包括坡下房屋、道路直到河岸。
    # 石桥 (x 300–325) 正在滑坡体下方，过桥等于顺着滑动方向往下跑，不采用。
    # 东线：从村子中部沿房后小路横向往东，出危险区后沿公路向东，再下小路到东侧避险棚。
    # 西侧住户的路线待定（两处避险棚都在河对岸，唯一的桥在危险区内），见交接说明。
    image: pic4.png
    hazard: landslide
    role: evacuation
    sources:
      - {type: polygon, region: 1, points: [[288, 25], [410, 25], [422, 90], [436, 160], [452, 230], [466, 300], [474, 336], [282, 336], [278, 260], [280, 160]]}
      - type: polyline
        region: 0
        width: 4
        lines:
          - {points: [[360, 258], [400, 268], [440, 278], [470, 290], [500, 312], [540, 322], [568, 332], [556, 350], [544, 366], [548, 384]], t0: 0, t1: 200}
    spots: [[556, 392, 9]]
