# 滑坡卡（虚构山村，生图 AI 底图 tools/Photo/landslide/，不入库）：致因 → 发生 → 后果 → 撤离。
# 准备：py -I tools/scenes/landslide_village/prepare_landslide_village.py
# 生成：py -I tools/make_scene_pack.py tools/scenes/landslide_village/scene.yaml --gif
# 坐标为 640x480 像素。PIC1/PIC3 为同一斜俯视构图，PIC2 为坡体近景，PIC4 为正俯视。
name: landslide_village
format: 3
size: [640, 480]
base: pic1.png
output: out

stages:
  - name: 致因：持续强降雨，坡体饱水
    # 斜俯视。坡中部裸露黄土区及其下方坡面是隐患坡体，黄色虚线框出，直到坡脚梯田上沿。
    image: pic1.png
    hazard: landslide
    role: cause
    sources:
      - {type: outline, region: 0, width: 3, points: [[300, 118], [360, 100], [420, 110], [445, 170], [452, 240], [445, 285], [300, 288], [282, 235], [288, 170]]}

  - name: 发生：坡顶拉裂、坡体下滑、落石
    # 坡体近景，写实表现，不用提示色。依滑坡的发展顺序：
    #   1. 后缘拉裂（t 0–70）：锯齿状细裂缝从坡顶中部向两侧扩展，随后加宽（t 60–130）；
    #   2. 两侧剪切（t 70–150）：沿滑坡体两侧向坡下出现侧缘裂缝；
    #   3. 整体下滑（t 100–200）：滑坡体自上而下逐片变暗下沉，后缘露出新鲜黄土的主滑壁（t 100–190）；
    #   4. 解体（t 130–225）：体内陆续出现三道横向拉张裂缝（呈雁列状断续），裸露土斑自上而下增多；
    #   5. 前缘隆起（t 190–235）：坡脚出现推挤隆起的新土；
    #   6. 落石（t ≥120）：三条路线，沿坡加速滚落到坡脚。
    image: pic2.png
    hazard: landslide
    role: onset
    sources:
      - type: polygon                       # 滑坡体：自上而下逐片下沉
        region: 2
        grade: down
        noise: 0.4
        cell: 20
        t0: 100
        t1: 200
        rough: 6
        seed: 11
        points: &body [[262, 100], [300, 74], [400, 64], [490, 96], [515, 130], [530, 240], [520, 340], [470, 364], [330, 364], [270, 330], [250, 220]]
      - type: patches                       # 裸露土斑：体内随机出现，自上而下
        region: 1
        threshold: 0.84
        cell: 6
        grade: down
        t0: 150
        t1: 220
        seed: 21
        points: *body
      - type: polygon                       # 前缘隆起：坡脚被推挤出的新土
        region: 1
        grade: down
        noise: 0.6
        t0: 190
        t1: 235
        rough: 3
        seed: 17
        points: [[318, 352], [372, 358], [440, 360], [494, 350], [500, 360], [462, 368], [340, 368], [314, 360]]
      - type: polyline                      # 落石路线：沿坡加速
        region: 3
        width: 5
        accel: true
        lines:
          - {points: [[330, 112], [325, 170], [320, 240], [318, 300], [324, 372]], t0: 0, t1: 239}
          - {points: [[410, 118], [414, 180], [422, 250], [430, 320], [440, 384]], t0: 0, t1: 239}
          - {points: [[470, 150], [480, 210], [492, 270], [505, 340], [518, 392]], t0: 0, t1: 239}
      - type: mask                          # 主滑壁：从裂缝向坡下加宽
        region: 1
        file: scarp_mask.png
        grade: down
        noise: 0.3
        cell: 8
        seed: 5
        t0: 100
        t1: 190
      - type: crack                         # 横向拉张裂缝：雁列状断续，自上而下依次出现
        region: 0
        width_min: 1
        width_max: 2.5
        jitter: 2
        seed: 41
        lines:
          - {points: [[300, 150], [340, 140], [372, 138]], t0: 130, t1: 160}
          - {points: [[384, 132], [430, 136], [478, 150]], t0: 136, t1: 168}
          - {points: [[282, 220], [330, 210], [380, 206]], t0: 160, t1: 192}
          - {points: [[396, 208], [450, 214], [500, 228]], t0: 166, t1: 198}
          - {points: [[290, 290], [350, 282], [410, 280]], t0: 190, t1: 220}
          - {points: [[424, 282], [470, 288], [505, 300]], t0: 196, t1: 225}
      - type: crack                         # 侧缘剪切裂缝：沿两侧向坡下
        region: 0
        width_min: 1.5
        width_max: 3
        jitter: 2.5
        seed: 43
        lines:
          - {points: [[266, 104], [256, 160], [252, 220], [262, 290], [276, 336]], t0: 70, t1: 150}
          - {points: [[512, 128], [524, 190], [530, 250], [522, 320], [508, 350]], t0: 74, t1: 150}
      - type: crack                         # 后缘裂缝加宽（同一路径、同一种子）
        region: 0
        width_min: 3
        width_max: 6
        jitter: 3
        seed: 47
        lines:
          - {points: [[380, 58], [330, 64], [296, 78], [266, 98]], t0: 60, t1: 130}
          - {points: [[380, 58], [430, 64], [470, 80], [500, 102], [512, 124]], t0: 60, t1: 130}
      - type: crack                         # 后缘裂缝：从坡顶中部向两侧扩展
        region: 0
        width_min: 1
        width_max: 2.5
        jitter: 3
        seed: 47
        lines:
          - {points: [[380, 58], [330, 64], [296, 78], [266, 98]], t0: 0, t1: 70}
          - {points: [[380, 58], [430, 64], [470, 80], [500, 102], [512, 124]], t0: 0, t1: 70}

  - name: 后果：坡体滑塌，堆积掩埋坡脚房屋和道路
    # 与 PIC1 同构图。滑坡后壁露出新鲜黄土；堆积体从坡脚向下扩展，盖过梯田、坡下房屋，止于道路。
    image: pic3.png
    hazard: landslide
    role: aftermath
    sources:
      - type: seeds                         # 堆积体：从坡脚中部向下、向两侧扩展
        region: 0
        points: [[350, 252], [366, 252], [382, 252]]
        mask: deposit_mask.png
        t0: 0
        t1: 239
      - {type: polygon, region: 1, rough: 5, seed: 13, points: [[300, 118], [360, 100], [420, 110], [445, 170], [450, 232], [300, 232], [288, 175]]}   # 滑坡后壁

  - name: 撤离：横向离开滑坡影响区，到东侧避险点
    # 正俯视。危险区：后壁 (x 292–408) 及其下方滑移、堆积范围，向下包括坡下房屋、道路直到河岸。
    # 石桥 (x 300–325) 正在滑坡体下方，过桥等于顺着滑动方向往下跑，不采用。
    # 东线：从村子中部沿房后小路横向往东，出危险区后沿公路向东，再下小路到东侧避险棚。
    # 西侧住户的路线待定（两处避险棚都在河对岸，唯一的桥在危险区内），见交接说明。
    image: pic4.png
    hazard: landslide
    role: evacuation
    sources:
      - {type: polygon, region: 1, points: [[288, 25], [410, 25], [422, 90], [436, 160], [452, 230], [466, 300], [474, 336], [282, 336], [278, 260], [280, 160]]}
      - type: polyline
        region: 0
        width: 4
        lines:
          - {points: [[360, 258], [400, 268], [440, 278], [470, 290], [500, 312], [540, 322], [568, 332], [556, 350], [544, 366], [548, 384]], t0: 0, t1: 200}
    spots: [[556, 392, 9]]
